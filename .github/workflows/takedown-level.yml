name: Remove reported level

# Срабатывает, когда мейнтейнер вешает на Issue-жалобу метку "takedown".
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: levels-catalog
  cancel-in-progress: false

jobs:
  takedown:
    if: github.event.label.name == 'takedown'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove level from catalog
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python tools/remove_level.py 2> error.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add levels
          git commit -m "Remove level (report #${{ github.event.issue.number }})"
          git push
      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "The level was removed from the catalog."
          gh issue close ${{ github.event.issue.number }}
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSG="$(cat error.txt 2>/dev/null || echo 'unknown error')"
          gh issue comment ${{ github.event.issue.number }} --body "Could not remove: $MSG"
